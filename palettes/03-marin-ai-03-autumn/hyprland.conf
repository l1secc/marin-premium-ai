# 3-stop gradient: pink → lilac → gold @ 45deg
$activeBorderColor   = rgba(cc6554ee) rgba(bca25cee) rgba(c98f5cee) 45deg
$inactiveBorderColor = rgba(8d665eaa)
$groupbarActive      = rgba(cc6554ff)

general {
    col.active_border   = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    gaps_in             = 5
    gaps_out            = 12
    border_size         = 2
}

group {
    col.border_active   = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
    groupbar {
        col.active   = $groupbarActive
        col.inactive = rgba(8d665eff)
        text_color   = rgba(35, 22, 20, 255)
    }
}

decoration {
    rounding       = 12
    rounding_power = 3

    # Soft, diffused window shadow — anime-poster depth
    shadow {
        enabled      = yes
        render_power = 3
        range        = 24
        color        = rgba(00000060)
        color_inactive = rgba(00000040)
        offset       = 0, 2
    }

    # Subtle background blur for a glassmorphism feel
    blur {
        enabled = true
        size    = 6
        passes  = 3
        noise   = 0.0117
        contrast = 1.0
        brightness = 1.0
        new_optimizations = on
    }
}

# Smooth, restrained window animations — "Marin glides through the screen"
animations {
    enabled = true

    # Bezier curves — calm, expressive but never jarring
    bezier = expressiveFastSpatial, 0.42, 1.67, 0.21, 0.90
    bezier = emphasizedDecel,      0.05, 0.7, 0.1, 1
    bezier = menu_decel,           0.1, 1, 0, 1
    bezier = emphasizedAccel,      0.3, 0, 0.8, 0.15

    animation = windowsIn,    1, 3, emphasizedDecel,       popin 80%
    animation = windowsOut,   1, 2, emphasizedDecel,       popin 90%
    animation = windowsMove,  1, 3, emphasizedDecel,       slide
    animation = border,       1, 10, emphasizedDecel
    animation = fade,         1, 4, menu_decel
    animation = fadeLayersIn, 1, 3, menu_decel
    animation = fadeLayersOut, 1, 2.7, menu_accel
    animation = workspaces,   1, 7, menu_decel,            slide
    animation = layersIn,     1, 2.7, emphasizedDecel,       popin 93%
    animation = layersOut,    1, 2.4, menu_accel,            popin 94%
}

# Disable desktop-wide dimming so colors stay honest in Marin palette
windowrulev2 = match:class .*, opacity 1.0 override 1.0 override, no_dim on