[bar]
background       = "#231d16"
background-alpha = 0.88
text             = "#e1dedb"
active           = "#cc8683"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(cc8683ee) rgba(76bc5cee) rgba(dac5a5ee) 45deg"
active-border-foreground = "#cc8683"

[controls]
normal-color        = "#d1c9c2"
normal-fill-alpha   = 0.05
normal-border       = "#d1c9c2"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f3f2f2"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#cc8683"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#cc8683"
focus-fill-alpha   = 0.12
focus-border       = "#cc8683"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#dac5a5"
selected-fill-alpha   = 0.18
selected-border       = "#dac5a5"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#2f251d"
background-alpha = 0.92
text             = "#e1dedb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

